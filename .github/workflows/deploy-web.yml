name: Deploy Web

on:
  push:
    branches:
      - main
      - preview
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runs from the repo ROOT, not apps/web. `vercel deploy` uploads its working
    # directory, and apps/web alone has no pnpm-workspace.yaml, no pnpm-lock.yaml
    # and no packages/shared — Vercel would find no pnpm lockfile, fall back to
    # npm, and fail on the "workspace:*" dependency on @agam/shared with:
    #   npm error Unsupported URL Type "workspace:"
    #
    # REQUIRES the Vercel project's Root Directory to be "apps/web":
    #   https://vercel.com/<team>/agam-plus-web/settings/build-and-deployment#root-directory
    # Without it Vercel builds the repo root, whose package.json has no "next",
    # and fails with "No Next.js version detected".
    #
    # Building in Actions and shipping `vercel deploy --prebuilt` was tried and
    # does not work here: pnpm keeps its store only at the repo root, so
    # apps/web/node_modules is symlinks into ../../node_modules/.pnpm. Deploying
    # prebuilt from apps/web makes that folder the deployment root, the traced
    # files sit outside it, and the deploy aborts with
    #   Please ensure project dependencies have been installed:
    #   File does not exist: node_modules/.pnpm/@opentelemetry+api@.../...
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        id: deploy_preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Alias Preview Deployment to Static Domain
        if: github.ref != 'refs/heads/main'
        run: |
          vercel alias set "${{ steps.deploy_preview.outputs.deployment_url }}" agam-plus-web-preview.vercel.app --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

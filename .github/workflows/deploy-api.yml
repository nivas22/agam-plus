name: Deploy API

on:
  push:
    branches:
      - main
      - preview
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Unlike deploy-web.yml and deploy-www.yml, this one still runs inside
    # apps/api. That works because apps/api has no "workspace:*" dependency, so
    # a directory-only upload installs cleanly without the workspace root. If
    # the API ever takes a dependency on @agam/shared, drop the
    # working-directory lines below and set this project's Root Directory to
    # "apps/api", exactly as the web and www workflows do.
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/api
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        id: deploy_preview
        working-directory: apps/api
        run: |
          DEPLOYMENT_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      - name: Alias Preview Deployment to Static Domain
        if: github.ref != 'refs/heads/main'
        working-directory: apps/api
        run: |
          vercel alias set "${{ steps.deploy_preview.outputs.deployment_url }}" agam-plus-api-preview.vercel.app --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
          
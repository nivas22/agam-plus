name: Deploy WWW

on:
  push:
    branches:
      - main
      - preview
    paths:
      - "apps/www/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-www.yml"
  workflow_dispatch:

concurrency:
  group: deploy-www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runs from the repo ROOT, not apps/www. `vercel deploy` uploads its working
    # directory, and apps/www alone has no pnpm-workspace.yaml, no
    # pnpm-lock.yaml and no packages/shared — Vercel would find no pnpm lockfile,
    # fall back to npm, and fail on the "workspace:*" dependency on @agam/shared
    # with: Unsupported URL Type "workspace:".
    #
    # Requires the Vercel project's Settings > Build and Deployment > Root Directory to be
    # "apps/www". Without it Vercel builds the repo root, whose package.json has
    # no "next", and fails with: No Next.js version detected.
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WWW }}

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        id: deploy_preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WWW }}

      - name: Alias Preview Deployment to Static Domain
        if: github.ref != 'refs/heads/main'
        run: |
          vercel alias set "${{ steps.deploy_preview.outputs.deployment_url }}" agam-plus-www-preview.vercel.app --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WWW }}
